
name: CRM - CI and ACR Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-docker:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore CRM dependencies
        run: dotnet restore CRM/CRM.csproj

      - name: Build CRM
        run: dotnet build CRM/CRM.csproj --configuration Release --no-restore

      - name: Run tests if test projects exist
        shell: bash
        run: |
          mapfile -t tests < <(find . -type f \
            \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
            -not -path '*/obj/*' \
            -not -path '*/bin/*' | sort)

          if [ ${#tests[@]} -eq 0 ]; then
            echo "No separate test project found. Skipping automated tests."
          else
            for test_project in "${tests[@]}"; do
              dotnet test "$test_project" \
                --configuration Release
            done
          fi

      - name: Build Docker image
        run: docker build --tag crm:${{ github.sha }} .

      - name: Verify Docker image
        run: docker image inspect crm:${{ github.sha }}

      - name: Login to Azure using OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Tag Docker image for ACR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          docker tag crm:${{ github.sha }} \
            "$ACR_NAME.azurecr.io/crm:${{ github.sha }}"

          docker tag crm:${{ github.sha }} \
            "$ACR_NAME.azurecr.io/crm:latest"

      - name: Push Docker image to ACR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          docker push "$ACR_NAME.azurecr.io/crm:${{ github.sha }}"
          docker push "$ACR_NAME.azurecr.io/crm:latest"
